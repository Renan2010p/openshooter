# Builds OpenShooter for Windows, Linux, macOS and Android and publishes a
# GitHub release. Manual only: Actions → Release → Run workflow.
#
# The release notes come from docs/releases/<version>.md (required). An
# optional docs/releases/<version>/trailer.mp4 is attached to the release.
# Banners for the notes: tools/release/make_banners.gd.
#
# Android signing: set these repository secrets to sign with your own release
# key (needed so future versions install over this one):
#   ANDROID_KEYSTORE_BASE64   base64 of the .keystore / .jks file
#   ANDROID_KEYSTORE_USER     key alias
#   ANDROID_KEYSTORE_PASSWORD keystore and key password
# Without them the APK is signed with a throwaway key generated by the run.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (creates tag v<version>; notes from docs/releases/<version>.md)"
        required: true
        default: "1.1.0"
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  VERSION: ${{ inputs.version }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release notes
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Version must look like 1.2.3"; exit 1; }
          test -f "docs/releases/$VERSION.md" \
            || { echo "::error::Missing docs/releases/$VERSION.md"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi

  export:
    name: Export ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            preset: Windows Desktop
            output: build/windows/OpenShooter.exe
          - name: Linux
            preset: Linux
            output: build/linux/OpenShooter.x86_64
          - name: macOS
            preset: macOS
            output: build/macos/OpenShooter.zip
          - name: Android
            preset: Android
            output: build/android/OpenShooter.apk
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-v1

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          tag="$GODOT_VERSION-$GODOT_STATUS"
          base="https://github.com/godotengine/godot/releases/download/$tag"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${tag}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${tag}_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${tag}_export_templates.tpz"
          dir=~/.local/share/godot/export_templates/$GODOT_VERSION.$GODOT_STATUS
          mkdir -p "$dir"
          # Only the templates this project exports (keeps the cache small).
          unzip -q -j /tmp/templates.tpz -d "$dir" \
            templates/version.txt \
            templates/linux_debug.x86_64 templates/linux_release.x86_64 \
            templates/windows_debug_x86_64.exe templates/windows_release_x86_64.exe \
            templates/windows_debug_x86_64_console.exe templates/windows_release_x86_64_console.exe \
            templates/macos.zip \
            templates/android_debug.apk templates/android_release.apk
          rm -f /tmp/godot.zip /tmp/templates.tpz

      - name: Add Godot to PATH
        run: |
          chmod +x ~/godot/godot
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Set version
        run: |
          python3 - <<'EOF'
          import os, re
          v = os.environ["VERSION"]
          major, minor, patch = (int(x) for x in v.split("."))
          code = major * 10000 + minor * 100 + patch
          def sub(path, pairs):
              s = open(path, encoding="utf-8").read()
              for pattern, value in pairs:
                  s = re.sub(pattern, value, s, flags=re.M)
              open(path, "w", encoding="utf-8").write(s)
          sub("project.godot", [(r'^config/version=".*"', f'config/version="{v}"')])
          sub("export_presets.cfg", [
              (r'^application/file_version=".*"', f'application/file_version="{v}.0"'),
              (r'^application/product_version=".*"', f'application/product_version="{v}.0"'),
              (r'^application/short_version=".*"', f'application/short_version="{v}"'),
              (r'^application/version=".*"', f'application/version="{v}"'),
              (r'^version/name=".*"', f'version/name="{v}"'),
              (r'^version/code=.*', f'version/code={code}'),
          ])
          EOF

      - name: Set up Java (Android)
        if: matrix.name == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android signing
        if: matrix.name == 'Android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            user="$KEYSTORE_USER"
            pass="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_* secrets not set; signing the APK with a throwaway key."
            user="openshooter"
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -v -keystore "$ks" -alias "$user" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pass" -keypass "$pass" \
              -dname "CN=OpenShooter, O=RL PROJECTS" >/dev/null
          fi
          echo "::add-mask::$pass"
          KS="$ks" KS_USER="$user" KS_PASS="$pass" python3 - <<'EOF'
          import os, re
          ks, user, pw = os.environ["KS"], os.environ["KS_USER"], os.environ["KS_PASS"]
          p = "export_presets.cfg"
          s = open(p, encoding="utf-8").read()
          for kind in ("debug", "release"):
              s = re.sub(rf'^keystore/{kind}=".*"', f'keystore/{kind}="{ks}"', s, flags=re.M)
              s = re.sub(rf'^keystore/{kind}_user=".*"', f'keystore/{kind}_user="{user}"', s, flags=re.M)
              s = re.sub(rf'^keystore/{kind}_password=".*"', f'keystore/{kind}_password="{pw}"', s, flags=re.M)
          open(p, "w", encoding="utf-8").write(s)
          EOF
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$ks"
          export/android/debug_keystore_user = "$user"
          export/android/debug_keystore_pass = "$pass"
          EOF

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p "$(dirname "${{ matrix.output }}")"
          godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
          test -s "${{ matrix.output }}"

      - name: Package
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            Windows)
              mkdir -p pkg/OpenShooter
              cp build/windows/OpenShooter.exe build/windows/*.dll LICENSE pkg/OpenShooter/
              (cd pkg && zip -qr9 "../dist/OpenShooter-$VERSION-windows-x86_64.zip" OpenShooter)
              ;;
            Linux)
              mkdir -p pkg/OpenShooter
              cp build/linux/OpenShooter.x86_64 build/linux/*.so LICENSE pkg/OpenShooter/
              chmod +x pkg/OpenShooter/OpenShooter.x86_64
              tar -C pkg -czf "dist/OpenShooter-$VERSION-linux-x86_64.tar.gz" OpenShooter
              ;;
            macOS)
              cp build/macos/OpenShooter.zip "dist/OpenShooter-$VERSION-macos-universal.zip"
              ;;
            Android)
              cp build/android/OpenShooter.apk "dist/OpenShooter-$VERSION-android.apk"
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: openshooter-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: export
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: openshooter-*
          merge-multiple: true

      - name: Add trailer
        run: |
          if [ -f "docs/releases/$VERSION/trailer.mp4" ]; then
            cp "docs/releases/$VERSION/trailer.mp4" "dist/OpenShooter-$VERSION-trailer.mp4"
          fi

      - name: Checksums
        run: |
          cd dist
          sha256sum OpenShooter-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          [ "${{ inputs.draft }}" = "true" ] && flags="$flags --draft"
          [ "${{ inputs.prerelease }}" = "true" ] && flags="$flags --prerelease"
          # shellcheck disable=SC2086
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "OpenShooter $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            $flags
